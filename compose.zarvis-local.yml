services:
  zarvis-action-gateway:
    image: node:24-alpine
    network_mode: host
    working_dir: /workspace/services/zarvis-action-gateway
    command: ["node", "server.mjs"]
    restart: unless-stopped
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m,mode=1777
    environment:
      ZARVIS_ACTION_HOST: 127.0.0.1
      ZARVIS_ACTION_PORT: ${ZARVIS_ACTION_PORT:-8098}
      ZARVIS_ACTION_DATA_DIR: /var/lib/zarvis-action
      ZARVIS_LOCAL_OWNER_TOKEN: ${ZARVIS_LOCAL_OWNER_TOKEN:?required}
      ZARVIS_ACTION_WORKER_TOKEN: ${ZARVIS_ACTION_WORKER_TOKEN:?required}
    volumes:
      - ./:/workspace:ro
      - zarvis_action_data:/var/lib/zarvis-action
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8098/healthz').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s

  zarvis-action-worker:
    image: node:24-alpine
    network_mode: host
    working_dir: /workspace/services/zarvis-action-gateway
    command: ["node", "worker.mjs"]
    restart: unless-stopped
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=8m,mode=1777
    environment:
      ZARVIS_ACTION_HOST: 127.0.0.1
      ZARVIS_ACTION_PORT: ${ZARVIS_ACTION_PORT:-8098}
      ZARVIS_ACTION_WORKER_INTERVAL_MS: ${ZARVIS_ACTION_WORKER_INTERVAL_MS:-1000}
      ZARVIS_ACTION_WORKER_TOKEN: ${ZARVIS_ACTION_WORKER_TOKEN:?required}
    volumes:
      - ./:/workspace:ro
    depends_on:
      zarvis-action-gateway:
        condition: service_healthy

volumes:
  zarvis_action_data:
    name: zarvis_action_data
