# TEMPORARY: remove after the lockfile refresh completes.
name: Temporary dependency lockfile refresh

on:
  push:
    branches:
      - fix/ai-gateway-anthropic-messages-20261029-r11
    paths:
      - "pnpm-workspace.yaml"
      - "services/ai-gateway/package.json"
      - ".github/workflows/refresh-lockfile-temp.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: temporary-lock-refresh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    if: ${{ github.ref == 'refs/heads/fix/ai-gateway-anthropic-messages-20261029-r11' && github.actor == 'cvsz' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/ai-gateway-anthropic-messages-20261029-r11
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Set up pinned pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.4.0

      - name: Regenerate workspace lockfile without lifecycle scripts
        run: pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts

      - name: Reconcile AI gateway npm lockfile without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --prefix services/ai-gateway

      - name: Verify only lockfiles changed
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          expected="$(printf '%s\n' 'pnpm-lock.yaml' 'services/ai-gateway/package-lock.json' | sort)"
          actual="$(git diff --name-only | sort)"
          diff -u <(printf '%s\n' "$expected") <(printf '%s\n' "$actual")

      - name: Commit lockfiles and dispatch exact-head validation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: fix/ai-gateway-anthropic-messages-20261029-r11
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml services/ai-gateway/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "fix(security): refresh patched dependency lockfiles"
            git push origin "HEAD:refs/heads/${BRANCH}"
          fi
          gh workflow run validate.yml --ref "${BRANCH}" --repo cvsz/z-platform
