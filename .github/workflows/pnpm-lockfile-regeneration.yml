name: Candidate pnpm lockfile regeneration

on:
  push:
    branches:
      - fix/pnpm-lockfile-agent-control-panel-20261029-run11
    paths:
      - ".github/workflows/pnpm-lockfile-regeneration.yml"
      - "apps/agent-control-panel/package.json"

permissions:
  contents: write

concurrency:
  group: pnpm-lockfile-regeneration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regenerate:
    if: github.ref == 'refs/heads/fix/pnpm-lockfile-agent-control-panel-20261029-run11'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          ref: fix/pnpm-lockfile-agent-control-panel-20261029-run11
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.4.0
      - name: Regenerate lockfile without executing dependency lifecycle scripts
        run: pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts --reporter=append-only
      - name: Verify frozen lockfile consistency
        run: pnpm install --lockfile-only --frozen-lockfile --ignore-scripts --reporter=append-only
      - name: Commit only the generated lockfile to this candidate branch
        env:
          TARGET_BRANCH: fix/pnpm-lockfile-agent-control-panel-20261029-run11
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/$TARGET_BRANCH"
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "pnpm-lock.yaml is already consistent; no commit required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- pnpm-lock.yaml
          git commit -m "fix(ci): regenerate pnpm lockfile for agent control panel"
          git push origin "HEAD:$TARGET_BRANCH"
