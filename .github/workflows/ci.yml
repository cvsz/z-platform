name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  node:
    name: Node workspace
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.4.0
      - name: Install dependencies
        run: pnpm install --ignore-scripts
      - name: Test runnable Node workspaces
        shell: bash
        run: |
          set -euo pipefail
          for workspace in \
            packages/contracts \
            apps/zaicoder/web \
            apps/zarvis-console \
            apps/zvoice \
            services/ai-gateway \
            services/agent-orchestrator \
            services/zarvis-orchestrator \
            services/zarvis-task-gateway \
            services/zarvis-memory \
            services/zarvis-action-gateway \
            services/zarvis-proactive \
            services/workspace-runtime \
            services/billing-ledger \
            apps/zchat \
            apps/zow \
            apps/zwallet \
            tools/zai-factory; do
            if [ ! -f "$workspace/package.json" ]; then
              echo "skip $workspace: no package.json"
              continue
            fi
            if ! find "$workspace" -path '*/node_modules' -prune -o -name '*.test.mjs' -print -quit | grep -q .; then
              echo "skip $workspace: no node test files"
              continue
            fi
            echo "test $workspace"
            npm test --prefix "$workspace" --if-present
          done

  zwallet-contract:
    name: ZWallet adapter contract (isolated)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24.22.1"
          package-manager-cache: false
      - name: Validate adapter syntax
        run: node --check apps/zwallet/server.mjs
      - name: Run fail-closed tenant and credit contract tests
        run: npm test --prefix apps/zwallet
