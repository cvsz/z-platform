name: ZARVIS Windows Dispatcher

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      version:
        description: SemVer Windows client version
        required: true
        default: "0.1.0"
        type: string
      publish_release:
        description: Publish repository release after successful build
        required: true
        default: false
        type: boolean

permissions:
  actions: write
  contents: read
  issues: write

jobs:
  dispatch:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.actor == 'cvsz' && github.event.issue.title == '[ZARVIS WINDOWS BUILD] 0.1.0')
    runs-on: ubuntu-latest
    steps:
      - name: Resolve dispatch inputs
        id: inputs
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_VERSION: ${{ inputs.version }}
          REQUESTED_PUBLISH: ${{ inputs.publish_release }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "issues" ]]; then
            echo "version=0.1.0" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            [[ "$REQUESTED_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]
            echo "version=$REQUESTED_VERSION" >> "$GITHUB_OUTPUT"
            echo "publish=$REQUESTED_PUBLISH" >> "$GITHUB_OUTPUT"
          fi

      - name: Dispatch Windows build
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.inputs.outputs.version }}
          PUBLISH_RELEASE: ${{ steps.inputs.outputs.publish }}
        run: |
          set -euo pipefail
          gh workflow run zarvis-windows.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f version="$VERSION" \
            -f publish_release="$PUBLISH_RELEASE"

      - name: Close owner build request
        if: ${{ github.event_name == 'issues' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue close "$ISSUE_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --comment "Windows build 0.1.0 dispatched without publishing a public release."
