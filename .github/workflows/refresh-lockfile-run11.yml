name: Temporary lockfile refresh (run 11)

on:
  push:
    branches:
      - fix/sbom-unnamed-package-identity
    paths:
      - pnpm-workspace.yaml
      - services/ai-gateway/package.json
      - services/zc/webapp/frontend-src/package.json
      - services/zc/webapp/frontend-src/package-lock.json
      - .github/workflows/refresh-lockfile-run11.yml

permissions:
  contents: write

concurrency:
  group: lockfile-refresh-run11
  cancel-in-progress: true

jobs:
  refresh-lockfiles:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: true
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 11.4.0
      - name: Refresh workspace lockfile without lifecycle scripts
        run: pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile
      - name: Refresh standalone ZC frontend lockfile without lifecycle scripts
        run: npm audit fix --package-lock-only --ignore-scripts --omit=dev --prefix services/zc/webapp/frontend-src
      - name: Verify production dependency audit
        run: npm audit --omit=dev --prefix services/zc/webapp/frontend-src
      - name: Commit only generated lockfiles to this PR branch
        shell: bash
        run: |
          set -euo pipefail
          git add pnpm-lock.yaml services/zc/webapp/frontend-src/package-lock.json
          if git diff --cached --quiet; then
            echo 'Lockfiles already match patched dependency resolution'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(deps): refresh lockfiles for patched dependencies'
          git push origin "HEAD:${GITHUB_REF_NAME}"
