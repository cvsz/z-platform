name: Temporary lockfile refresh (run 11)

on:
  push:
    branches:
      - fix/sbom-unnamed-package-identity
    paths:
      - pnpm-workspace.yaml
      - services/ai-gateway/package.json

permissions:
  contents: write

concurrency:
  group: lockfile-refresh-run11
  cancel-in-progress: true

jobs:
  refresh-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: true
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 11.4.0
      - name: Regenerate lockfile without executing lifecycle scripts
        run: pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile
      - name: Commit only the generated lockfile to this PR branch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- pnpm-lock.yaml; then
            echo 'pnpm-lock.yaml already matches the workspace overrides'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          git commit -m 'chore(deps): refresh lockfile for patched gateway dependencies'
          git push origin "HEAD:${GITHUB_REF_NAME}"
